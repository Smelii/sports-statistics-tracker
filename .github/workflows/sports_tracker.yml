
name: Daily Sports Statistics Tracker

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-sports-data:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect sports statistics
        run: python sports_data.py

      - name: Save collected statistics
        run: |
          git config user.name "Sports Tracker Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sports_data.json sports_history.json
          git diff --cached --quiet || git commit -m "Update sports statistics"
          git push
