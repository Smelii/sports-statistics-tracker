
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sports Statistics Tracker</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #101827;
  color: #f8fafc;
}
header {
  padding: 32px 20px;
  background: #172338;
  border-bottom: 1px solid #334155;
}
.container { max-width: 1100px; margin: auto; padding: 20px; }
h1 { margin: 0 0 8px; font-size: 30px; }
.muted { color: #94a3b8; }
.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 14px;
  margin: 22px 0;
}
.stat, .game {
  background: #1e293b;
  border: 1px solid #334155;
  border-radius: 12px;
  padding: 18px;
}
.stat strong { display: block; font-size: 27px; margin-top: 8px; }
.controls {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin: 20px 0;
}
button, input {
  padding: 12px 15px;
  border-radius: 8px;
  border: 1px solid #475569;
  background: #1e293b;
  color: white;
  font-size: 15px;
}
button { cursor: pointer; }
button.active { background: #2563eb; border-color: #2563eb; }
button:disabled { opacity: 0.6; cursor: wait; }
input { flex: 1; min-width: 200px; }
.game { margin-bottom: 14px; }
.game-top {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 14px;
}
.team {
  display: flex;
  justify-content: space-between;
  padding: 10px 0;
  border-bottom: 1px solid #334155;
}
.winner { color: #4ade80; font-weight: bold; }
.players { margin-top: 16px; }
.players summary { cursor: pointer; color: #93c5fd; }
.player {
  padding: 10px 0;
  border-bottom: 1px solid #334155;
  font-size: 14px;
}
.error { color: #fca5a5; }
footer { padding: 30px; text-align: center; color: #94a3b8; }
</style>
</head>
<body>

<header>
  <div class="container">
    <h1>Sports Statistics Tracker</h1>
    <div class="muted">NBA · NFL · NHL | Scores, players and historical data</div>
    <p id="updated" class="muted">Loading statistics...</p>
    <p id="refreshStatus" class="muted">Checking for updates...</p>
    <button id="refreshButton" onclick="loadData()">↻ Refresh Statistics</button>
  </div>
</header>

<main class="container">
  <section class="stats">
    <div class="stat">Total Games<strong id="totalGames">0</strong></div>
    <div class="stat">NBA Games<strong id="nbaGames">0</strong></div>
    <div class="stat">NFL Games<strong id="nflGames">0</strong></div>
    <div class="stat">NHL Games<strong id="nhlGames">0</strong></div>
  </section>

  <div class="controls">
    <button class="active" data-sport="ALL">All Sports</button>
    <button data-sport="NBA">NBA</button>
    <button data-sport="NFL">NFL</button>
    <button data-sport="NHL">NHL</button>
    <input id="search" placeholder="Search teams or players...">
  </div>

  <h2>Game History</h2>
  <p id="message" class="muted">Loading games...</p>
  <div id="games"></div>
</main>

<footer>
  Sports Statistics Tracker · Automatically checks for new data every 5 minutes
</footer>

<script>
let allGames = [];
let selectedSport = "ALL";
let isLoading = false;

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;",
    '"': "&quot;", "'": "&#39;"
  })[char]);
}

function displayDate(value) {
  if (!value) return "Date unavailable";
  const date = new Date(value);
  return isNaN(date) ? escapeHTML(value) : date.toLocaleString();
}

function normalizeGames(data) {
  if (Array.isArray(data)) return data;
  if (!data || typeof data !== "object") return [];

  if (data.games && typeof data.games === "object") {
    return Array.isArray(data.games)
      ? data.games
      : Object.values(data.games);
  }

  return Object.entries(data)
    .filter(([key, value]) =>
      key !== "last_updated" &&
      key !== "updated_at" &&
      value && typeof value === "object" &&
      !Array.isArray(value)
    )
    .map(([, value]) => value)
    .filter(game => game.sport);
}

function renderGames() {
  const search = document.getElementById("search").value.toLowerCase();

  const filtered = allGames.filter(game => {
    const sportMatch = selectedSport === "ALL" || game.sport === selectedSport;
    return sportMatch && JSON.stringify(game).toLowerCase().includes(search);
  });

  document.getElementById("message").textContent =
    filtered.length ? `${filtered.length} games found` : "No matching games found.";

  document.getElementById("games").innerHTML = filtered.map(game => {
    const teams = Array.isArray(game.teams) ? game.teams : [];
    const players = Array.isArray(game.players) ? game.players : [];

    const teamHTML = teams.map(team => `
      <div class="team">
        <span>
          ${escapeHTML(team.team)}
          ${team.home_away ? `(${escapeHTML(team.home_away)})` : ""}
          ${team.record ? `<span class="muted"> · ${escapeHTML(team.record)}</span>` : ""}
        </span>
        <strong class="${team.winner ? "winner" : ""}">
          ${team.score == null ? "—" : escapeHTML(team.score)}
          ${team.winner ? " ✓" : ""}
        </strong>
      </div>
    `).join("");

    const playerHTML = players.length ? `
      <details class="players">
        <summary>View ${players.length} player entries</summary>
        ${players.map(player => {
          const stats = player.statistics || {};
          const statText = Object.entries(stats)
            .map(([key, value]) =>
              `${escapeHTML(key)}: ${escapeHTML(
                typeof value === "object" ? JSON.stringify(value) : value
              )}`
            ).join(" · ");

          return `<div class="player">
            <strong>${escapeHTML(player.player)}</strong>
            ${player.position ? ` · ${escapeHTML(player.position)}` : ""}
            ${player.team ? ` · ${escapeHTML(player.team)}` : ""}
            <div class="muted">${statText || "No statistics available"}</div>
          </div>`;
        }).join("")}
      </details>
    ` : `<p class="muted">No player statistics available for this game.</p>`;

    return `
      <article class="game">
        <div class="game-top">
          <strong>${escapeHTML(game.sport)} · ${escapeHTML(game.game)}</strong>
          <span class="muted">${displayDate(game.date)}</span>
        </div>
        <div class="muted">${escapeHTML(game.status || "Status unavailable")}</div>
        ${teamHTML || '<p class="muted">No team information available.</p>'}
        ${playerHTML}
      </article>
    `;
  }).join("");
}

async function fetchJSON(filename) {
  const response = await fetch(
    `${filename}?refresh=${Date.now()}`,
    { cache: "no-store" }
  );
  if (!response.ok) throw new Error(`Could not load ${filename}`);
  return response.json();
}

async function loadData() {
  if (isLoading) return;
  isLoading = true;

  const button = document.getElementById("refreshButton");
  button.disabled = true;
  button.textContent = "Refreshing...";

  try {
    let history;
    let games = [];

    try {
      history = await fetchJSON("sports_history.json");
      games = normalizeGames(history);
    } catch (error) {
      console.log("History file not available; trying latest data.");
    }

    if (!games.length) {
      const latest = await fetchJSON("sports_data.json");
      games = Object.values(latest.sports || {}).flat();
      history = latest;
    }

    allGames = games.sort((a, b) =>
      new Date(b.date || 0) - new Date(a.date || 0)
    );

    document.getElementById("totalGames").textContent = allGames.length;
    document.getElementById("nbaGames").textContent =
      allGames.filter(g => g.sport === "NBA").length;
    document.getElementById("nflGames").textContent =
      allGames.filter(g => g.sport === "NFL").length;
    document.getElementById("nhlGames").textContent =
      allGames.filter(g => g.sport === "NHL").length;

    const updated = history?.last_updated || history?.updated_at || "";

    document.getElementById("updated").textContent =
      updated ? `Sports data last updated: ${displayDate(updated)}` :
      "Sports data loaded";

    document.getElementById("refreshStatus").textContent =
      `Website checked for updates: ${new Date().toLocaleTimeString()}`;

    renderGames();

  } catch (error) {
    document.getElementById("refreshStatus").textContent =
      "Could not refresh data. Please try again.";
    document.getElementById("message").innerHTML =
      `<span class="error">${escapeHTML(error.message)}</span>`;
  } finally {
    isLoading = false;
    button.disabled = false;
    button.textContent = "↻ Refresh Statistics";
  }
}

document.querySelectorAll("button[data-sport]").forEach(button => {
  button.addEventListener("click", () => {
    selectedSport = button.dataset.sport;
    document.querySelectorAll("button[data-sport]").forEach(b =>
      b.classList.toggle("active", b === button)
    );
    renderGames();
  });
});

document.getElementById("search").addEventListener("input", renderGames);

loadData();

// Automatically check for new data every five minutes.
setInterval(loadData, 5 * 60 * 1000);
</script>
</body>
</html>
